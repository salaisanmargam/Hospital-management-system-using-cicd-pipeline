# .gitleaks.toml
# Gitleaks configuration – allowlist known-safe patterns so CI doesn't false-positive.
# Docs: https://github.com/gitleaks/gitleaks#configuration

title = "MedCore HMS – Gitleaks Config"

[extend]
# Extend the default ruleset (detects 150+ secret types out of the box)
useDefault = true

# ── Global allowlist ─────────────────────────────────────────────────────────
[allowlist]
description = "Known-safe CI values and placeholder patterns"

regexes = [
  # CI dummy DATABASE_URL (not a real credential)
  "postgresql://test:test@localhost/test_medcore",
  # CI JWT test secret
  "ci-test-secret-key-not-for-production",
  # Placeholder JWT secret in .env.example
  "change_me_to_a_long_random_string",
  # Placeholder DB URL pattern in .env.example
  "postgresql://user:password@host/dbname",
]

paths = [
  # Example / template files never contain real secrets
  ".env.example",
  "README.md",
  "backend/README.md",
  # Build outputs and dependencies
  "node_modules",
  "dist",
  ".vercel",
  "backend/app/__pycache__",
  "backend/app/routers/__pycache__",
]

