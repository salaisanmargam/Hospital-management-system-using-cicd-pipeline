apiVersion: apps/v1
kind: Deployment
metadata:
  name: medcore-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: medcore-frontend
  template:
    metadata:
      labels:
        app: medcore-frontend
    spec:
      containers:
      - name: frontend
        # Update this tag to the SHA produced by the docker-publish workflow
        # VITE_API_URL is baked in at build time (/api) — no runtime env var needed
        image: ghcr.io/salaisanmargam/hospital-management-system-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
