apiVersion: apps/v1
kind: Deployment
metadata:
  name: medcore-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: medcore-backend
  template:
    metadata:
      labels:
        app: medcore-backend
    spec:
      containers:
      - name: backend
        image: medcore-backend:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - secretRef:
            name: backend-env
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
