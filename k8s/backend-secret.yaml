apiVersion: v1
kind: Secret
metadata:
  name: backend-env
type: Opaque
stringData:
  # Replace CHANGE_ME values before running kubectl apply.
  # Generate a JWT secret: python -c "import secrets; print(secrets.token_hex(32))"
  DATABASE_URL: "postgresql://root:CHANGE_ME@medcore-db:5432/medcore_hms"
  POSTGRES_PASSWORD: "CHANGE_ME"
  JWT_SECRET: "CHANGE_ME"
  JWT_ALGORITHM: "HS256"
  JWT_EXPIRE_MINUTES: "480"
  APP_CORS_ORIGINS: "http://medcore.local,http://localhost"
