name: Deploy to Vercel

on:
  push:
    branches:
      - main          # production deployment
      - staging       # preview deployment (optional)
  workflow_dispatch:  # allow manual triggers from the GitHub UI

permissions:
  actions: read
  contents: read
  packages: write
  security-events: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true  # cancel older queued deploys for the same branch

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Gate 1: Secret scan – must pass before anything else
  # ─────────────────────────────────────────────────────────────────────────────
  secrets:
    name: Secret scan
    uses: ./.github/workflows/ci-secret-scan.yml

  # ─────────────────────────────────────────────────────────────────────────────
  # Gate 2: Frontend CI – type-check + build
  # ─────────────────────────────────────────────────────────────────────────────
  ci-frontend:
    name: Frontend CI
    uses: ./.github/workflows/ci-frontend.yml

  # ─────────────────────────────────────────────────────────────────────────────
  # Gate 3: Backend CI – ruff lint + pytest + env-key check
  # ─────────────────────────────────────────────────────────────────────────────
  ci-backend:
    name: Backend CI
    uses: ./.github/workflows/ci-backend.yml

  # ─────────────────────────────────────────────────────────────────────────────
  # Gate 4: Build & push Docker images to GHCR
  # ─────────────────────────────────────────────────────────────────────────────
  docker-publish:
    name: Docker publish
    needs: [secrets, ci-frontend, ci-backend]
    uses: ./.github/workflows/docker-publish.yml

  # ─────────────────────────────────────────────────────────────────────────────
  # Gate 5: Trivy image security scan
  # ─────────────────────────────────────────────────────────────────────────────
  docker-scan:
    name: Docker Trivy scan
    needs: [docker-publish]
    uses: ./.github/workflows/docker-scan.yml

  # ─────────────────────────────────────────────────────────────────────────────
  # Deploy – only runs when ALL three gates pass
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy (${{ github.ref_name }})
    runs-on: ubuntu-latest
    needs: [secrets, ci-frontend, ci-backend, docker-publish, docker-scan]

    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
      url: ${{ steps.vercel-deploy.outputs.deploymentUrl }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # uv is required by Vercel's Python runtime builder
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      # Pull Vercel project metadata (creates .vercel/ directory)
      - name: Pull Vercel environment info
        run: |
          vercel pull --yes \
            --environment=${{ github.ref_name == 'main' && 'production' || 'preview' }} \
            --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Build – Vercel CLI respects vercel.json build settings
      - name: Build project artifacts
        run: |
          vercel build \
            ${{ github.ref_name == 'main' && '--prod' || '' }} \
            --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Deploy pre-built artifacts (fast – no rebuild on Vercel servers)
      - name: Deploy to Vercel
        id: vercel-deploy
        run: |
          URL=""
          for attempt in 1 2 3; do
            echo "Deploy attempt ${attempt}/3..."
            set +e
            DEPLOY_OUTPUT=$(vercel deploy --prebuilt --yes \
              ${{ github.ref_name == 'main' && '--prod' || '' }} \
              --token=${{ secrets.VERCEL_TOKEN }} 2>&1)
            STATUS=$?
            set -e

            echo "$DEPLOY_OUTPUT"

            if [ $STATUS -eq 0 ]; then
              URL=$(echo "$DEPLOY_OUTPUT" | tail -n 1)
              break
            fi

            if [ $attempt -lt 3 ]; then
              echo "Transient deploy failure, retrying in 10s..."
              sleep 10
            fi
          done

          if [ -z "$URL" ]; then
            echo "Vercel deploy failed after 3 attempts"
            exit 1
          fi

          echo "deploymentUrl=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to: $URL"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Post-deploy smoke test (frontend + API)
        run: |
          URL="${{ steps.vercel-deploy.outputs.deploymentUrl }}"
          echo "Smoke testing $URL"
          ROOT_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL")

          if [ "$ROOT_CODE" = "200" ]; then
            echo "Frontend URL is public (200). Running strict smoke checks..."
            curl -fsSL "$URL" >/dev/null
            curl -fsSL "$URL/api/health" >/dev/null
            echo "Smoke test passed"
          elif [ "$ROOT_CODE" = "401" ] || [ "$ROOT_CODE" = "403" ]; then
            echo "Deployment URL is access-protected (HTTP $ROOT_CODE)."
            echo "Skipping external smoke check for this deployment URL."
          else
            echo "Smoke test failed: unexpected HTTP $ROOT_CODE at $URL"
            exit 1
          fi

      # Post deployment URL as a PR comment (handy for preview deployments)
      - name: Comment deployment URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Preview deployment ready!**\n\n${process.env.DEPLOY_URL}`
            });
        env:
          DEPLOY_URL: ${{ steps.vercel-deploy.outputs.deploymentUrl }}
