name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_call:   # allow deploy.yml to re-use this workflow as a CI gate

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Frontend – type-check + build
  # ─────────────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (type-check & build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npm run typecheck

      - name: Build (Vite)
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'http://localhost:8000' }}
          VITE_USE_MOCK_AUTH: "false"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Backend – lint + tests (no real DB needed)
  # ─────────────────────────────────────────────────────────────────────────────
  backend:
    name: Backend (lint & tests)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint with Ruff (non-blocking on first run)
        run: |
          pip install ruff --quiet
          ruff check . --output-format=github || true

      - name: Run pytest
        run: |
          pytest tests/ -v --tb=short
        env:
          # Dummy DATABASE_URL – no real DB needed since the pool is mocked
          DATABASE_URL: postgresql://test:test@localhost/test_medcore
          JWT_SECRET: ci-test-secret-key-not-for-production
          JWT_ALGORITHM: HS256
          JWT_EXPIRE_MINUTES: "60"
          APP_CORS_ORIGINS: "http://localhost:3000"
