name: Docker – Scan Published Images

# Scans published GHCR images for this commit SHA with Trivy.
# CRITICAL CVEs with available fixes will fail the job.
# Results are uploaded to the GitHub Security tab (SARIF).

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: docker-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan-published-images:
    name: Scan published image (${{ matrix.name }})
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read
      security-events: write   # required to upload SARIF to GitHub Security tab

    strategy:
      fail-fast: false          # scan both images even if one fails
      matrix:
        include:
          - name: backend
            image_suffix: backend

          - name: frontend
            image_suffix: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image reference
        id: image
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "ref=ghcr.io/${REPO}-${{ matrix.image_suffix }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Pull image
        run: docker pull "${{ steps.image.outputs.ref }}"

      # ── Install Trivy from a fixed release tarball to avoid the install.sh
      #    GitHub tag lookup that intermittently fails in CI.
      - name: Install Trivy
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sfL https://github.com/aquasecurity/trivy/releases/download/v0.60.0/trivy_0.60.0_Linux-64bit.tar.gz \
            -o trivy.tar.gz
          tar -xzf trivy.tar.gz trivy
          install -m 0755 trivy "$HOME/.local/bin/trivy"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          trivy --version

      # ── Trivy scan → SARIF (appears in GitHub Security → Code scanning) ───
      - name: Scan ${{ matrix.name }} with Trivy (SARIF)
        run: |
          trivy image \
            --format sarif \
            --output trivy-${{ matrix.name }}.sarif \
            --vuln-type os,library \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            "${{ steps.image.outputs.ref }}"

      - name: Upload ${{ matrix.name }} SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles(format('trivy-{0}.sarif', matrix.name)) != ''
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}

      # ── Trivy scan → table (human-readable summary in job log) ────────────
      # exit-code 1 = fail CI if any CRITICAL with a fix is found
      - name: Scan ${{ matrix.name }} with Trivy (table – fail on fixable CRITICAL)
        run: |
          trivy image \
            --format table \
            --vuln-type os,library \
            --severity CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            "${{ steps.image.outputs.ref }}"
