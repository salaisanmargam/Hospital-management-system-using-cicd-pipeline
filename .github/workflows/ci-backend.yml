name: CI – Backend

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_call: # reusable by deploy.yml

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint & tests)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      # ── Step 1: Ruff lint (blocks on any error) ─────────────────
      - name: Lint with Ruff
        run: |
          pip install ruff --quiet
          ruff check . --output-format=github

      # ── Step 2: Unit / smoke tests (DB pool is mocked) ──────────
      - name: Run pytest
        run: pytest tests/ -v --tb=short
        env:
          DATABASE_URL: postgresql://test:test@localhost/test_medcore
          JWT_SECRET: ci-test-secret-key-not-for-production
          JWT_ALGORITHM: HS256
          JWT_EXPIRE_MINUTES: "60"
          APP_CORS_ORIGINS: "http://localhost:3000"

      # ── Step 3: Check all required env vars are documented ───────
      - name: Verify .env.example is up-to-date
        working-directory: ${{ github.workspace }}
        run: |
          echo "Checking .env.example exists and lists required keys..."
          for key in DATABASE_URL JWT_SECRET JWT_ALGORITHM JWT_EXPIRE_MINUTES; do
            grep -q "^${key}=" .env.example \
              || (echo "ERROR: ${key} missing from .env.example" && exit 1)
          done
          echo "All required keys found in .env.example"
