name: CI – Secret Scan

# Runs on EVERY push and PR to catch secrets before they spread.
# A failed scan blocks the deploy workflow from starting.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_call: # reusable by deploy.yml

concurrency:
  group: ci-secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret & credential scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code (full history for gitleaks)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so gitleaks can scan all commits in the push

      # ── Step 1: Gitleaks – detect hardcoded secrets ─────────────
      # Detects: API keys, DB URLs with passwords, JWTs, private keys, etc.
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}  # only needed for org-level scans

      # ── Step 2: Ensure .env is not tracked by git ───────────────
      - name: Confirm .env is not committed
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "ERROR: .env file is tracked by git! Run: git rm --cached .env"
            exit 1
          fi
          echo ".env is not tracked – OK"

      # ── Step 3: Scan for common secret patterns in staged files ──
      - name: Check for raw secret patterns in source files
        run: |
          echo "Scanning for common secret patterns..."
          found=0

          # Detect real Neon/PostgreSQL passwords (skip CI dummy and example values)
          if grep -rn \
               --include="*.py" --include="*.ts" --include="*.tsx" \
               --include="*.js" --include="*.json" --include="*.yml" \
               --include="*.yaml" --include="*.env*" \
               --exclude=".env.example" \
               --exclude-dir=".git" --exclude-dir="node_modules" --exclude-dir="dist" \
               'postgresql://[^:]\+:[^@/]\+@[^/]*neon\.tech' .; then
            echo "WARNING: Possible live Neon DB URL found in tracked files."
            found=1
          fi

          # Detect generic password= / secret= assignments (not in example or CI files)
          if grep -rn \
               --include="*.py" --include="*.ts" --include="*.tsx" \
               --exclude-dir=".git" --exclude-dir="node_modules" --exclude-dir="dist" \
               --exclude="*.example" \
               'password\s*=\s*["\x27][^"\x27]\{8,\}["\x27]' . | \
               grep -v 'ci-test\|test:test\|change_me\|your_password'; then
            echo "WARNING: Possible hardcoded password found."
            found=1
          fi

          if [ "$found" -eq 1 ]; then
            echo ""
            echo "Review the above matches. If they are safe, add them to .gitleaks.toml allowlist."
            exit 1
          fi

          echo "No secret patterns found – OK"
