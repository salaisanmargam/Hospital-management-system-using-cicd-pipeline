version: '3.8'
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      - DATABASE_URL=postgresql://root:medcore_dev_pass@db:5432/medcore_hms
      - JWT_SECRET=medcore_dev_jwt_secret_change_in_prod
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRE_MINUTES=480
      - APP_NAME=MedCore API
      - APP_CORS_ORIGINS=http://localhost:3000,http://localhost:5173
      - DB_POOL_SIZE=5
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - VITE_API_URL=http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: medcore_hms
      POSTGRES_USER: root
      POSTGRES_PASSWORD: medcore_dev_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d medcore_hms"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
